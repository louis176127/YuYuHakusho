<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>悠遊白書｜盟友報名</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-wrap">

  <header class="site-header">
    <div class="title-block">
      <div class="seal-stamp">悠遊白書</div>
      <div class="title-text">
        <h1>悠遊白書</h1>
        <p>三國志戰略版・同盟登記處</p>
      </div>
    </div>
    <nav class="site-nav">
      <a href="index.html" class="active">盟友報名</a>
      <a href="list.html">盟友清單</a>
    </nav>
  </header>

  <section class="scroll-card">
    <h2 class="section-title"><span class="eyebrow">壹</span>盟友報名</h2>
    <p class="section-desc">請如實填寫下列資訊，送出後將登入同盟名冊。若遊戲名稱有異動，請於「新遊戲名稱」欄位備註。</p>

    <form id="signup-form" novalidate>
      <div class="form-grid">
        <div class="field full">
          <label for="gameName">遊戲名稱 <span class="required">*</span></label>
          <input type="text" id="gameName" name="gameName" placeholder="請輸入目前遊戲內顯示的名稱" required>
        </div>

        <div class="field">
          <label for="lineName">Line 名稱</label>
          <input type="text" id="lineName" name="lineName" placeholder="方便聯繫用的 Line 暱稱（選填）">
        </div>

        <div class="field">
          <label for="group">組別 <span class="required">*</span></label>
          <select id="group" name="group" required>
            <option value="" disabled selected>請選擇組別</option>
          </select>
        </div>

        <div class="field full">
          <label for="newGameName">新遊戲名稱 <span class="hint">（僅於改名時填寫）</span></label>
          <input type="text" id="newGameName" name="newGameName" placeholder="若最近有改遊戲名稱，請填寫新名稱">
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="submit-btn">送出登記</button>
        <span class="status-msg" id="status-msg"></span>
      </div>
    </form>
  </section>

  <footer class="site-footer">悠遊白書 ・ 同盟內部管理工具</footer>
</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
