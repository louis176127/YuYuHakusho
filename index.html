<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>悠遊白書｜S27盟友報名</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-wrap">

  <header class="site-header">
    <div class="title-block">
      <div class="seal-stamp">悠遊白書</div>
      <div class="title-text">
        <h1>悠遊白書</h1>
        <p>三國志戰略版</p>
      </div>
    </div>
    <div class="header-controls">
      <nav class="site-nav" id="site-nav"></nav>
      <div class="admin-lock" id="admin-lock">
        <span class="dot"></span>
        <span id="admin-lock-label">管理權限：未解鎖</span>
        <button type="button" class="btn btn-ghost btn-small" id="admin-lock-btn">解鎖</button>
      </div>
    </div>
  </header>

  <section class="scroll-card">
    <h2 class="section-title"><span class="eyebrow">壹</span>S27盟友報名</h2>
    <p class="section-desc">請如實填寫下列資訊，送出後將登入同盟名冊。若遊戲名稱有異動，請於「新遊戲名稱」欄位備註。</p>

    <form id="signup-form" novalidate>
      <div class="form-grid">
        <div class="field full">
          <label for="gameName">遊戲名稱 <span class="required">*</span></label>
          <input type="text" id="gameName" name="gameName" placeholder="請輸入目前遊戲內顯示的名稱" required>
        </div>

        <div class="field">
          <label for="lineName">Line 名稱</label>
          <input type="text" id="lineName" name="lineName" placeholder="方便聯繫用的 Line 暱稱（選填）">
        </div>

        <div class="field">
          <label for="group">組別 <span class="required">*</span></label>
          <select id="group" name="group" required>
            <option value="" disabled selected>請選擇組別</option>
          </select>
        </div>

        <div class="field full">
          <label for="newGameName">新遊戲名稱 <span class="hint">（僅於改名時填寫）</span></label>
          <input type="text" id="newGameName" name="newGameName" placeholder="若最近有改遊戲名稱，請填寫新名稱">
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="submit-btn">送出登記</button>
        <span class="status-msg" id="status-msg"></span>
      </div>
    </form>
  </section>

  <footer class="site-footer">悠遊白書 ・ 同盟內部管理工具</footer>
</div>

<!-- 解鎖管理權限 Modal -->
<div class="modal-backdrop" id="unlock-modal">
  <div class="modal">
    <h3>解鎖管理權限</h3>
    <div class="form-grid">
      <div class="field">
        <label>管理密碼</label>
        <input type="password" id="unlock-password" placeholder="請輸入管理密碼">
      </div>
    </div>
    <div class="status-msg err" id="unlock-error"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" data-close="unlock-modal">取消</button>
      <button type="button" class="btn btn-primary" id="unlock-confirm">確認</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>ybsInitAuthUI('index');</script>
</body>
</html>
