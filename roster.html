<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>悠遊白書｜分組名冊</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-wrap">

  <header class="site-header">
    <div class="title-block">
      <div class="seal-stamp">悠遊白書</div>
      <div class="title-text">
        <h1>悠遊白書</h1>
        <p>三國志戰略版・同盟登記處</p>
      </div>
    </div>
    <div class="header-controls">
      <nav class="site-nav" id="site-nav"></nav>
      <div class="admin-lock" id="admin-lock">
        <span class="dot"></span>
        <span id="admin-lock-label">管理權限：未解鎖</span>
        <button type="button" class="btn btn-ghost btn-small" id="admin-lock-btn">解鎖</button>
      </div>
    </div>
  </header>

  <section class="scroll-card">
    <h2 class="section-title"><span class="eyebrow">肆</span>分組名冊</h2>
    <p class="section-desc">以組別彙整盟友清單，各組內高戰盟友排在前面並以顏色標示。此頁僅限已解鎖管理權限的成員瀏覽。</p>

    <div id="locked-gate" class="locked-gate">
      <p>此頁面僅限同盟管理者查看。請先在右上角輸入管理密碼解鎖，即可瀏覽分組名冊。</p>
      <button type="button" class="btn btn-primary" id="locked-gate-unlock">輸入管理密碼</button>
    </div>

    <div id="roster-content" style="display:none;">
      <div class="form-actions" style="margin-top:0; margin-bottom:14px;">
        <button type="button" class="btn btn-ghost" id="refresh-btn">重新整理</button>
        <label class="flag-toggle" style="font-weight:500;">
          <input type="checkbox" id="only-selected"> 僅顯示已入選盟友
        </label>
        <span class="status-msg" id="roster-status"></span>
      </div>

      <div class="roster-legend">
        <span class="legend-item"><span class="legend-dot vet"></span>高戰盟友</span>
        <span class="legend-item"><span class="legend-dot normal"></span>一般盟友</span>
      </div>

      <div class="table-wrap">
        <table class="ledger roster-table" id="roster-table">
          <thead>
            <tr id="roster-head"></tr>
          </thead>
          <tbody id="roster-body">
            <tr class="empty-row"><td>載入中…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <footer class="site-footer">悠遊白書 ・ 同盟內部管理工具</footer>
</div>

<!-- 解鎖管理權限 Modal -->
<div class="modal-backdrop" id="unlock-modal">
  <div class="modal">
    <h3>解鎖管理權限</h3>
    <div class="form-grid">
      <div class="field">
        <label>管理密碼</label>
        <input type="password" id="unlock-password" placeholder="請輸入管理密碼">
      </div>
    </div>
    <div class="status-msg err" id="unlock-error"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" data-close="unlock-modal">取消</button>
      <button type="button" class="btn btn-primary" id="unlock-confirm">確認</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/roster.js"></script>
</body>
</html>
